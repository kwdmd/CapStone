<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- [직접 수정] 브라우저 탭 제목의 기본값. 실행 시 data/project.json 설정으로 덮어쓴다. -->
<title>WAVE · 이재범이 직접 구현한 ...</title>
  <!-- [구조 설명] CSS는 디자인, JS는 버튼과 3D 장면을 담당한다. app.bundle.js는 분리된 JS/JSON을 묶은 실행 파일이다. 파일을 이동하면 아래 상대 경로도 함께 바꾼다. -->
<link rel="stylesheet" href="css/popup.css">
  <script src="js/app.bundle.js" defer></script>
</head>
<body>
  <!-- [구조 설명] 상단 바. 왼쪽 브랜드와 중앙 제목은 CSS에서 별도로 배치한다. -->
<header class="topbar">
    <div class="brand" aria-label="이재범이 직접 구현한 ...">
      <!-- [직접 수정] 로고 기본값은 이모지다. 변경 시 aria-label도 새 로고의 의미로 바꾼다. JSON의 logo도 맞춘다. -->
<span class="brand-logo" role="img" aria-label="눈물 흘리며 웃는 얼굴">🥲</span>
      <!-- [직접 수정] 프로젝트명 기본값. br은 줄바꿈이다. 실행 시 JSON의 projectName이 적용된다. -->
<span class="brand-name" id="projectName">이재범이<br>직접 구현한 ...</span>
    </div>
    <!-- [직접 수정] 중앙 제목 기본값. WAVE를 원하는 이름으로 변경하고 JSON의 pageTitle도 동일하게 수정한다. -->
<h1 class="page-title">WAVE</h1>
  </header>
  <main class="popup" aria-label="온라인 팝업 전시">
    <!-- [구조 설명] 3D 렌더러가 들어가는 중앙 영역. CSS overflow로 상하단 바 밖의 렌더링을 잘라낸다. -->
    <div id="scene" class="scene" tabindex="0" aria-label="3D 맵 배치 영역"></div>
    <!-- [구조 설명] 왼쪽 미니맵 패널. 크기와 위치는 CSS의 .minimap에서 수정한다. 지도 내용은 minimapContent에 연결한다. -->
<aside class="minimap" aria-label="미니맵">
      <h2>MINI MAP</h2>
      <div id="minimapContent"><canvas id="miniCanvas" width="280" height="280" aria-label="현재 위치가 표시된 지도" role="img"></canvas></div>
    </aside>
    <!-- [구조 설명] 오른쪽 설정·장바구니 영역. 위치와 너비는 CSS의 .right-panel에서 조절한다. -->
<aside class="right-panel" aria-label="전시 설정과 장바구니">
      <!-- [직접 수정] 버튼 id는 JS가 참조하므로 이름을 바꾸면 JS도 수정해야 한다. 표시 문구는 JS의 renderControls에서 바뀐다. -->
<div class="controls">
        <button id="viewButton" type="button" aria-label="1인칭으로 전환">3인칭</button>
        <button id="soundButton" type="button" aria-pressed="true">소리 ON</button>
      </div>
      <!-- [직접 수정] SHOPPING CART 제목은 아래 h2 텍스트를 변경한다. cartItems는 나중에 상품 목록을 넣을 영역이다. -->
<section class="cart" aria-labelledby="cartTitle">
        <h2 id="cartTitle">SHOPPING CART</h2>
        <div id="cartItems"></div>
      </section>
    </aside>
  <p class="scene-status" id="sceneStatus" role="status">맵을 준비하고 있어요…</p>
<p class="move-guide">WASD / 방향키 이동 · 드래그 시선 회전 · Shift 달리기</p>
</main>
  <!-- [직접 수정] 하단 바에 문구나 링크를 추가할 위치. 높이와 색은 CSS에서 조절한다. -->
<footer class="bottom-bar" aria-label="하단 영역"></footer>
</body>
</html>
