<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- [직접 수정] 브라우저 탭 제목의 기본값. 실행 시 data/project.json 설정으로 덮어쓴다. -->
    <title>WAVE · 이재범이 직접 구현한 ...</title>
    <!-- [구조 설명] CSS는 디자인, JS는 버튼과 3D 장면을 담당한다. app.bundle.js는 분리된 JS/JSON을 묶은 실행 파일이다. 파일을 이동하면 아래 상대 경로도 함께 바꾼다. -->
    <link rel="stylesheet" href="css/popup.css" />
    <script src="js/app.bundle.js" defer></script>
  </head>
  <body>
    <main class="popup" aria-label="온라인 팝업 전시">
      <!-- [직접 수정] 화면 좌측 상단 브랜드. 문구와 줄바꿈은 data/project.json에서 설정한다. -->
      <div class="brand" aria-label="프로젝트명">
        <span class="brand-logo" role="img" aria-label="눈물 흘리며 웃는 얼굴"
          >🥲</span
        >
        <h1 class="brand-name" id="projectName">
          이재범이 직접 구현한<br />온라인 팝업 스토어
        </h1>
      </div>
      <!-- [구조 설명] 3D 렌더러가 들어가는 중앙 영역. 화면 전체를 채우고 UI를 그 위에 겹쳐 표시한다. -->
      <div
        id="scene"
        class="scene"
        tabindex="0"
        aria-label="3D 맵 배치 영역"
      ></div>
      <!-- [구조 설명] 왼쪽 미니맵 패널. 크기와 위치는 CSS의 .minimap에서 수정한다. 지도 내용은 minimapContent에 연결한다. -->
      <aside class="minimap" aria-label="미니맵">
        <h2>MINI MAP</h2>
        <div id="minimapContent">
          <canvas
            id="miniCanvas"
            width="280"
            height="280"
            aria-label="현재 위치가 표시된 지도"
            role="img"
          ></canvas>
        </div>
        <p class="location-legend"><span aria-hidden="true"></span>나의 위치</p>
      </aside>
      <!-- [구조 설명] 오른쪽 설정·장바구니 영역. 위치와 너비는 CSS의 .right-panel에서 조절한다. -->
      <aside class="right-panel" aria-label="전시 설정과 장바구니">
        <!-- [직접 수정] 버튼 id는 JS가 참조하므로 이름을 바꾸면 JS도 수정해야 한다. 표시 문구는 JS의 renderControls에서 바뀐다. -->
        <!-- [구조 설명] 세 아이콘은 동일한 SVG 스타일을 사용한다. 수량은 이미지가 아닌 실제 숫자로 갱신한다. -->
        <div class="controls icon-controls">
          <!-- [구조 설명] 눈 버튼은 미니맵과 조작 안내를 숨기거나 다시 표시한다. -->
          <button
            id="visibilityButton"
            type="button"
            aria-label="미니맵과 조작 안내 숨기기"
            title="미니맵과 조작 안내 숨기기"
            aria-pressed="true"
          >
            <svg class="stable-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#ffffff"
                fill-opacity="1"
                fill-rule="evenodd"
                d="M3 24 Q24 1 45 24 Q24 47 3 24Z M33 24 A9 9 0 1 0 15 24 A9 9 0 1 0 33 24Z"
              />
              <circle cx="24" cy="24" r="5" fill="#ffffff" fill-opacity="1" />
              <path
                class="eye-slash"
                d="M7 7 41 41"
                stroke="#ffffff"
                stroke-width="4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="viewButton"
            type="button"
            aria-label="1인칭으로 전환"
            title="1인칭으로 전환"
          >
            <svg class="stable-icon" viewBox="0 0 48 48" aria-hidden="true">
              <g fill="#ffffff" fill-opacity="1">
                <rect x="5" y="12" width="28" height="24" rx="6" />
                <path d="M33 19 41 14 Q44 12 44 16 V32 Q44 36 41 34 L33 29Z" />
              </g>
              <text
                id="cameraStateText"
                x="19"
                y="25"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="#142232"
              >
                3P
              </text>
            </svg>
          </button>
          <button
            id="soundButton"
            type="button"
            aria-label="소리 끄기"
            title="소리 끄기"
            aria-pressed="true"
          >
            <svg class="stable-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#ffffff"
                fill-opacity="1"
                d="M6 18 H13 L23 9 Q26 7 26 11 V37 Q26 41 23 39 L13 30 H6 Q3 30 3 27 V21 Q3 18 6 18Z"
              />
              <g
                class="sound-waves"
                fill="none"
                stroke="#ffffff"
                stroke-opacity="1"
                stroke-width="4"
                stroke-linecap="round"
              >
                <path d="M32 17 Q38 24 32 31" />
                <path d="M38 11 Q49 24 38 37" />
              </g>
              <path
                class="sound-slash"
                d="M6 7 41 41"
                stroke="#ffffff"
                stroke-opacity="1"
                stroke-width="4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="cartButton"
            type="button"
            aria-label="장바구니, 상품 0개"
            title="장바구니"
            aria-expanded="false"
            aria-controls="cartPanel"
          >
            <!-- [구조 설명] 다른 아이콘과 동일한 48×48 좌표·흰색·불투명. 수량 배지는 별도 요소로 유지한다. -->
            <svg class="stable-icon" viewBox="0 0 48 48" aria-hidden="true">
              <g fill="#ffffff" fill-opacity="1">
                <path
                  d="M5 8 H10 Q12 8 12.5 10 L14 15 H40 Q43 15 42 18 L38 30 Q37.5 32 35 32 H18 L18.8 35 H35 Q37 35 37 37 Q37 39 35 39 H18 Q16 39 15.5 37 L9 12 H5 Q3 12 3 10 Q3 8 5 8Z"
                />
                <circle cx="20" cy="43" r="3" />
                <circle cx="34" cy="43" r="3" />
              </g></svg
            ><span
              id="cartBadge"
              class="cart-badge"
              hidden
              aria-hidden="true"
            ></span>
          </button>
        </div>
        <section class="cart" id="cartPanel" aria-labelledby="cartTitle" hidden>
          <h2 id="cartTitle">장바구니</h2>
          <div id="cartItems">아직 담은 상품이 없습니다.</div>
        </section>
      </aside>
      <p class="scene-status" id="sceneStatus" role="status">
        맵을 준비하고 있어요…
      </p>
      <p class="move-guide">
        WASD / 방향키 이동 · 드래그 시선 회전 · Shift 달리기
      </p>
    </main>
  </body>
</html>
